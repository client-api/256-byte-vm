name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm qemu-utils xorriso

      - name: Build all formats
        run: make all

      - name: Verify size
        run: make check

      - name: Show artifact sizes
        run: |
          ls -la build/
          file build/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 256-byte-vm-images
          path: |
            build/boot.bin
            build/boot.img
            build/boot.qcow2
            build/boot.vdi
            build/boot.vmdk
            build/boot-flat.vmdk
            build/boot.vhd
            build/boot.iso
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm qemu-utils xorriso qemu-system-x86 socat

      - name: Build
        run: make all

      - name: End-to-end (banner + REPL + ACPI shutdown)
        run: make test

      - name: Banner appears on ISO boot
        run: |
          timeout 15 qemu-system-x86_64 \
            -display none -no-reboot \
            -serial file:serial-iso.log \
            -cdrom build/boot.iso || true
          echo "--- serial-iso.log ---"
          cat serial-iso.log
          grep -q "ClientAPI" serial-iso.log

      - name: Banner appears on Q35 machine
        run: |
          timeout 15 qemu-system-x86_64 \
            -machine q35 \
            -display none -no-reboot \
            -serial file:serial-q35.log \
            -drive format=raw,file=build/boot.img || true
          echo "--- serial-q35.log ---"
          cat serial-q35.log
          grep -q "ClientAPI" serial-q35.log

  release:
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm qemu-utils xorriso zip

      - name: Build release artifacts
        run: make all

      - name: Bundle release zip + checksums
        working-directory: build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          zip -9 "../256-byte-vm-${VERSION}.zip" boot.*
          sha256sum boot.* | tee SHA256SUMS
          sha256sum "../256-byte-vm-${VERSION}.zip" | tee -a SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/boot.bin
            build/boot.img
            build/boot.qcow2
            build/boot.vdi
            build/boot.vmdk
            build/boot-flat.vmdk
            build/boot.vhd
            build/boot.iso
            build/SHA256SUMS
            256-byte-vm-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
